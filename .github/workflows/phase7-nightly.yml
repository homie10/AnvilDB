name: Phase 7 Nightly Verification

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: phase7-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-higher-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Phase 7 chaos harness (higher bounds)
        run: |
          cargo test -p db-raft --test phase7_chaos \
            phase7_chaos_harness_higher_bounds_nightly \
            -- --ignored --exact

  tlc-higher-bounds:
    runs-on: ubuntu-latest
    needs: chaos-higher-bounds
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ tools
        run: |
          set -euo pipefail
          for url in \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          do
            if curl -fsSL "$url" -o tla2tools.jar; then
              break
            fi
          done
          test -s tla2tools.jar
      - name: Phase 7 TLC model check (higher bounds)
        run: |
          timeout 600s java -XX:+UseSerialGC -Xmx3g -cp tla2tools.jar tlc2.TLC \
            -deadlock -workers 2 \
            -config spec/kv_raft_nightly.cfg \
            spec/kv_raft.tla
