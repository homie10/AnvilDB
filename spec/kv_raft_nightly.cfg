SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2, n3}
  Keys = {k1, k2, k3}
  Values = {v1, v2, v3}

INVARIANTS
  TypeInv
  CommitMonotonicInv
  ElectionCommitLinkInv
  CommittedPrefixAgreementInv
  CommittedLogMatchingInv
  CommittedStateAgreementInv

CONSTRAINT
  /\ clock <= 6
  /\ Len(deliveryQueue) <= 4
  /\ \A n \in Nodes : Len(log[n]) <= 4
  /\ \A n \in Nodes : currentTerm[n] <= 7
