SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2, n3}
  Keys = {k1, k2}
  Values = {v1, v2}

INVARIANTS
  TypeInv
  CommitMonotonicInv
  ElectionCommitLinkInv
  CommittedPrefixAgreementInv
  CommittedLogMatchingInv
  CommittedStateAgreementInv

CONSTRAINT
  /\ clock <= 4
  /\ Len(deliveryQueue) <= 3
  /\ \A n \in Nodes : Len(log[n]) <= 3
  /\ \A n \in Nodes : currentTerm[n] <= 5
